
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Crash Pro 3.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#091525;color:white;
 font-family:Arial;text-align:center;
}
header{
 padding:18px;background:#172c46;
 font-size:24px;font-weight:bold;
}
#balance{font-size:23px;padding:15px;color:#19df9a}
#game{
 margin:12px;height:340px;
 background:linear-gradient(#164361,#101d32);
 border-radius:18px;position:relative;overflow:hidden;
}
#multiplier{font-size:48px;font-weight:bold;padding-top:40px}
#status{color:#c8d8e8;margin-top:8px}
#plane{
 position:absolute;left:8%;bottom:35px;
 font-size:42px;z-index:2;
}
#graph{
 position:absolute;bottom:0;left:0;
 width:100%;height:190px;
}
.panel{
 margin:14px;padding:15px;
 background:#17283e;border-radius:14px;
}
input{
 width:100%;padding:13px;margin-top:8px;
 border:0;border-radius:8px;
 font-size:18px;text-align:center;
}
button{
 padding:15px 20px;border:0;
 border-radius:10px;font-size:17px;
 font-weight:bold;margin:6px;
}
#start{background:#13bd77;color:white}
#cash{background:#ffb52e;color:#111}
#cash:disabled{opacity:.4}
#history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.item{background:#263d56;padding:10px;border-radius:8px}
.win{color:#19df9a}
.loss{color:#ff5d65}
.stats{display:flex;justify-content:space-around;gap:8px}
.stats div{background:#263d56;padding:12px;border-radius:10px;flex:1}
.small{font-size:13px;color:#bdcbd9}
</style>
</head>
<body>

<header>✈ SKY CRASH PRO 3.0</header>

<div id="balance">Demo Points: 1000</div>

<div id="game">
 <div id="multiplier">1.00x</div>
 <div id="status">START दबाकर खेलें</div>
 <div id="plane">✈️</div>
 <svg id="graph" viewBox="0 0 350 190"
 preserveAspectRatio="none">
 <polyline id="line" points="0,190"
 fill="none" stroke="#ff4545"
 stroke-width="4" stroke-linecap="round"/>
 </svg>
</div>

<div class="panel">
 <label>Bet Amount (Demo Points)</label>
 <input id="bet" type="number" value="100" min="10" max="1000">

 <label>Auto Cash Out (उदाहरण: 2.00x)</label>
 <input id="auto" type="number" value="2" min="1.01" step=".01">

 <button id="sound" onclick="toggleSound()">🔊 SOUND ON</button>
</div>

<div>
 <button id="start" onclick="startGame()">START</button>
 <button id="cash" onclick="cashOut()" disabled>CASH OUT</button>
</div>

<div class="panel">
 <h3>📊 GAME RECORD</h3>
 <div class="stats">
  <div>जीत<br><b id="wins">0</b></div>
  <div>हार<br><b id="losses">0</b></div>
 </div>
 <h3>LAST 10 ROUNDS</h3>
 <div id="history">अभी कोई राउंड नहीं</div>
</div>

<p class="small">Demo Points Only • No Real Money</p>

<script>
let balance=1000;
let running=false;
let timer=null;
let multiplier=1;
let startTime=0;
let crashAt=0;
let betAmount=100;
let autoAt=2;
let soundOn=true;
let wins=0;
let losses=0;
let history=[];
let points=[];

const el=id=>document.getElementById(id);

function updateBalance(){
 el("balance").innerText="Demo Points: "+balance;
}

function beep(freq,duration){
 if(!soundOn)return;
 try{
  let ctx=new (window.AudioContext||window.webkitAudioContext)();
  let osc=ctx.createOscillator();
  let gain=ctx.createGain();
  osc.frequency.value=freq;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  gain.gain.setValueAtTime(.12,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   .001,ctx.currentTime+duration
  );
  osc.stop(ctx.currentTime+duration);
 }catch(e){}
}

function toggleSound(){
 soundOn=!soundOn;
 el("sound").innerText=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
}

function startGame(){
 if(running)return;

 betAmount=Number(el("bet").value);
 autoAt=Number(el("auto").value);

 if(!Number.isFinite(betAmount)||betAmount<10||
 betAmount>1000||betAmount>balance){
  el("status").innerText="सही Bet Amount डालें!";
  return;
 }

 if(!Number.isFinite(autoAt)||autoAt<1.01){
  el("status").innerText="Auto Cash Out कम से कम 1.01x रखें";
  return;
 }

 balance-=betAmount;
 updateBalance();

 running=true;
 multiplier=1;
 startTime=Date.now();

 crashAt=1.5+Math.random()*3.5;
 points=["0,190"];

 el("line").setAttribute("points","0,190");
 el("plane").style.left="8%";
 el("plane").style.bottom="35px";
 el("plane").style.opacity="1";
 el("multiplier").innerText="1.00x";
 el("status").innerText="✈ PLANE FLYING";
 el("start").disabled=true;
 el("cash").disabled=false;

 timer=setInterval(()=>{
  let t=(Date.now()-startTime)/1000;
  multiplier=Math.exp(t*.22);

  el("multiplier").innerText=multiplier.toFixed(2)+"x";

  let x=Math.min(350,t*55);
  let y=Math.max(10,190-t*24);

  points.push(x+","+y);
  el("line").setAttribute("points",points.join(" "));

  el("plane").style.left=Math.min(83,8+t*12)+"%";
  el("plane").style.bottom=Math.min(240,35+t*18)+"px";

  if(autoAt<crashAt && multiplier>=autoAt){
   cashOut(true);
   return;
  }

  if(multiplier>=crashAt){
   crash();
  }
 },100);
}

function cashOut(isAuto=false){
 if(!running)return;

 let finalMultiplier=multiplier;
 let win=Math.floor(betAmount*finalMultiplier);

 balance+=win;
 wins++;

 finish(
  "CASH OUT SUCCESS!",
  finalMultiplier,
  "जीत: "+win+" Demo Points",
  true
 );
}

function crash(){
 if(!running)return;
 losses++;

 finish(
  "💥 CRASHED!",
  multiplier,
  "आपके "+betAmount+" Demo Points हार गए",
  false
 );
}

function finish(status,mult,result,isWin){
 running=false;
 clearInterval(timer);

 el("cash").disabled=true;
 el("start").disabled=false;
 el("status").innerText=status;
 el("result");
 el("multiplier").innerText=mult.toFixed(2)+"x";
 el("plane").style.opacity=".6";

 if(isWin){
  beep(800,.2);
 }else{
  beep(150,.5);
 }

 history.unshift({
  multiplier:mult.toFixed(2)+"x",
  win:isWin
 });
 history=history.slice(0,10);

 el("history").innerHTML=history.map(h=>
  '<span class="item '+(h.win?'win':'loss')+'">'+
  h.multiplier+'</span>'
 ).join("");

 el("wins").innerText=wins;
 el("losses").innerText=losses;

 updateBalance();

 setTimeout(()=>{
  el("plane").style.opacity="1";
  el("plane").style.transform="none";
 },800);

 el("start").innerText="NEXT ROUND";
}

updateBalance();
</script>
  <style>
#scp-auth-overlay {
  position:fixed; inset:0; z-index:999999;
  display:flex; align-items:center; justify-content:center;
  background:#080d1b; padding:18px; overflow:auto;
  font-family:Arial,sans-serif;
}
#scp-auth-card {
  width:100%; max-width:380px; background:#151f35;
  color:white; padding:25px; border-radius:18px;
  box-sizing:border-box; text-align:center;
}
#scp-auth-card input {
  width:100%; box-sizing:border-box; padding:14px;
  margin:10px 0; border:1px solid #52617b;
  border-radius:9px; font-size:16px;
}
#scp-auth-card button {
  width:100%; padding:14px; margin:8px 0;
  background:#1687ff; color:white; border:0;
  border-radius:9px; font-size:16px;
}
#scp-auth-status {font-size:13px;color:#ffd36a;}
</style>

<div id="scp-auth-overlay">
  <div id="scp-auth-card">
    <h2>✈️ SKY CRASH PRO</h2>
    <p>Mobile OTP Login</p>

    <p>अपना मोबाइल नंबर डालें</p>
    <input id="scp-phone" type="tel"
      maxlength="10" inputmode="numeric"
      placeholder="10 अंकों का मोबाइल नंबर">

    <div id="scp-recaptcha"></div>

    <button id="scp-send">Send OTP</button>

    <div id="scp-otp-area" style="display:none">
      <input id="scp-otp" type="text"
        maxlength="6" inputmode="numeric"
        placeholder="6 अंकों का OTP">
      <button id="scp-verify">Verify & Login</button>
    </div>

    <p id="scp-auth-status">
      Demo Points की कोई नकद कीमत नहीं है।
    </p>
  </div>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0E7QWlVz4DfQ2OJJ0NUvRSb0KpH8YOJI",
  authDomain: "sky-crash-pro.firebaseapp.com",
  projectId: "sky-crash-pro",
  storageBucket: "sky-crash-pro.firebasestorage.app",
  messagingSenderId: "89452660513",
  appId: "1:89452660513:web:0c3cf6272077c2bad66060",
  measurementId: "G-PH6N3HQMZZ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "hi";

let recaptchaVerifier = null;
let confirmationResult = null;

const overlay = document.getElementById("scp-auth-overlay");
const phoneInput = document.getElementById("scp-phone");
const otpInput = document.getElementById("scp-otp");
const otpArea = document.getElementById("scp-otp-area");
const statusBox = document.getElementById("scp-auth-status");
const sendButton = document.getElementById("scp-send");
const verifyButton = document.getElementById("scp-verify");

onAuthStateChanged(auth, (user) => {
  overlay.style.display = user ? "none" : "flex";
});

sendButton.addEventListener("click", async () => {
  const phone = phoneInput.value.replace(/\D/g, "");

  if (phone.length !== 10) {
    statusBox.textContent = "सही 10 अंकों का नंबर डालें।";
    return;
  }

  sendButton.disabled = true;
  statusBox.textContent = "OTP भेजा जा रहा है...";

  try {
    if (!recaptchaVerifier) {
      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "scp-recaptcha",
        { size: "normal" }
      );
      await recaptchaVerifier.render();
    }

    confirmationResult = await signInWithPhoneNumber(
      auth,
      "+91" + phone,
      recaptchaVerifier
    );

    otpArea.style.display = "block";
    statusBox.textContent = "OTP भेज दिया गया है।";
  } catch (error) {
    statusBox.textContent = "समस्या: " + error.message;

    if (recaptchaVerifier) {
      await recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  }

  sendButton.disabled = false;
});

verifyButton.addEventListener("click", async () => {
  const code = otpInput.value.trim();

  if (!confirmationResult) {
    statusBox.textContent = "पहले Send OTP दबाएँ।";
    return;
  }

  if (code.length !== 6) {
    statusBox.textContent = "6 अंकों का OTP डालें।";
    return;
  }

  verifyButton.disabled = true;
  statusBox.textContent = "OTP चेक हो रहा है...";

  try {
    await confirmationResult.confirm(code);
    statusBox.textContent = "Login सफल हुआ!";
  } catch (error) {
    statusBox.textContent = "गलत OTP या समस्या: " + error.message;
  }

  verifyButton.disabled = false;
});
</script>
</body>
</html>
